server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Next.js's own build output is content-hashed (the filename changes
    # whenever the content does) — safe to cache aggressively and immutably.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else served from public/ (main.js, frame images, the
    # manifest) keeps the same filename across rebuilds even when its
    # content changes. Never mark these immutable — a returning browser
    # would silently keep serving stale app logic/assets after a redeploy.
    location ~* \.(?:webp|jpg|jpeg|png|ico|js|css|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    error_page 404 /404.html;
}
